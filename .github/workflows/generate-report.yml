name: Generate ANITEC PDF

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint fonts-dejavu fonts-liberation

      - name: Set output name
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "REPORT_NAME=ANITEC-AV1" >> "$GITHUB_ENV"
          else
            echo "REPORT_NAME=ANITEC-develop" >> "$GITHUB_ENV"
          fi

      - name: Build complete Markdown
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path.cwd()
          order_file = root / "report-order.txt"
          build_dir = root / "build"

          report_name = os.environ["REPORT_NAME"]
          output_file = build_dir / f"{report_name}.md"

          build_dir.mkdir(exist_ok=True)

          files = [
              line.strip()
              for line in order_file.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          ]

          result = []

          image_pattern = re.compile(r'!\[([^\]]*)\]\(([^)]+)\)')

          for index, relative_file in enumerate(files):
              source = root / relative_file

              if not source.exists():
                  raise FileNotFoundError(
                      f"No se encontró el archivo: {relative_file}"
                  )

              print(f"Agregando: {relative_file}")

              content = source.read_text(encoding="utf-8")
              source_directory = source.parent

              def replace_image(match):
                  alt = match.group(1)
                  image = match.group(2).strip()

                  if image.startswith(("http://", "https://", "data:")):
                      return match.group(0)

                  image_path = (source_directory / image).resolve()

                  try:
                      relative_image = image_path.relative_to(root.resolve())
                  except ValueError:
                      return match.group(0)

                  return f"![{alt}]({relative_image.as_posix()})"

              content = image_pattern.sub(replace_image, content)

              result.append(content)

              if index < len(files) - 1:
                  result.append(
                      '\n\n<div class="report-section-break"></div>\n\n'
                  )

          output_file.write_text(
              "".join(result),
              encoding="utf-8"
          )

          print(f"Markdown generado: {output_file}")
          PY

      - name: Create PDF styles
        run: |
          cat > build/report.css <<'EOF'
          @page {
            size: A4;
            margin-top: 2.3cm;
            margin-bottom: 2.3cm;
            margin-left: 2.5cm;
            margin-right: 2.5cm;

            @bottom-center {
              content: "Página " counter(page);
              font-size: 8pt;
              color: #555;
            }
          }

          html {
            font-family: Arial, "Liberation Sans", sans-serif;
          }

          body {
            font-family: Arial, "Liberation Sans", sans-serif;
            font-size: 11pt;
            line-height: 1.45;
            color: #111;
          }

          .report-section-break {
            break-before: page;
            page-break-before: always;
          }

          h1,
          h2,
          h3,
          h4,
          h5,
          h6 {
            break-after: avoid;
            page-break-after: avoid;
            color: #111;
          }

          h1 {
            font-size: 22pt;
            margin-top: 0;
            margin-bottom: 18px;
          }

          h2 {
            font-size: 18pt;
            margin-top: 20px;
            margin-bottom: 12px;
          }

          h3 {
            font-size: 15pt;
            margin-top: 18px;
            margin-bottom: 10px;
          }

          h4 {
            font-size: 13pt;
            margin-top: 16px;
            margin-bottom: 8px;
          }

          h5 {
            font-size: 12pt;
            margin-top: 14px;
            margin-bottom: 8px;
          }

          p {
            text-align: justify;
            orphans: 3;
            widows: 3;
            margin-top: 6px;
            margin-bottom: 8px;
          }

          a {
            color: #111;
            text-decoration: none;
          }

          img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 16px auto;
            break-inside: avoid;
            page-break-inside: avoid;
          }

          figure {
            break-inside: avoid;
            page-break-inside: avoid;
          }

          table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            margin-bottom: 16px;
            font-size: 9pt;
            break-inside: auto;
          }

          thead {
            display: table-header-group;
          }

          tfoot {
            display: table-footer-group;
          }

          tr {
            break-inside: avoid;
            page-break-inside: avoid;
          }

          th,
          td {
            border: 1px solid #555;
            padding: 6px;
            vertical-align: top;
            overflow-wrap: anywhere;
          }

          th {
            font-weight: bold;
            text-align: left;
          }

          ul,
          ol {
            margin-top: 5px;
            margin-bottom: 10px;
          }

          li {
            margin-bottom: 3px;
          }

          blockquote {
            break-inside: avoid;
          }

          pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 9pt;
          }

          code {
            font-family: "DejaVu Sans Mono", monospace;
          }
          EOF

      - name: Generate HTML
        run: |
          pandoc "build/${REPORT_NAME}.md" \
            --from=gfm+raw_html \
            --standalone \
            --resource-path=. \
            --embed-resources \
            --css=build/report.css \
            --metadata title="ANITEC - Informe del Trabajo Final" \
            -o "build/${REPORT_NAME}.html"

      - name: Generate PDF
        run: |
          weasyprint \
            "build/${REPORT_NAME}.html" \
            "build/${REPORT_NAME}.pdf"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_NAME }}
          path: build/${{ env.REPORT_NAME }}.pdf
          retention-days: 7
